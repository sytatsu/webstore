# Pinned so this stack never shares a Compose project namespace with
# docker-compose.yml (which defaults to the directory name) -- without this,
# running both from the same directory can make Compose treat same-named
# services here as updates to the dev containers and destroy them.
name: sytatsu-prod

services:
    php-fpm:
        container_name: sytatsu-php-fpm-prod
        build:
            context: .
            dockerfile: .docker/prod/Dockerfile
            target: php-fpm
        image: sytatsu-app:latest
        restart: unless-stopped
        env_file:
            - .env.production
        # Lets the container reach a database (or any service) running on the
        # Docker host itself when it isn't part of this compose stack.
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # FILESYSTEM_DISK=local writes here; shared with nginx below so
        # uploads are visible without going through this container.
        volumes:
            - storage-app-public:/var/www/html/storage/app/public
        networks:
            - sytatsu-prod
            - dbnet

    scheduler:
        container_name: sytatsu-scheduler-prod
        build:
            context: .
            dockerfile: .docker/prod/Dockerfile
            target: php-fpm
        image: sytatsu-app:latest
        restart: unless-stopped
        env_file:
            - .env.production
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # app/Console/Kernel.php schedules webstore:generate-sitemap (daily);
        # nothing else in this stack ever calls schedule:run, so it needs its
        # own long-running process rather than a one-off cron on the host.
        command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
        volumes:
            - storage-app-public:/var/www/html/storage/app/public
        # Both this and php-fpm mount the same empty volume at the same path;
        # starting concurrently races Docker's "seed empty volume from image"
        # step (mkdir collisions). Let php-fpm populate it first.
        depends_on:
            - php-fpm
        networks:
            - sytatsu-prod
            - proxy

    nginx:
        container_name: sytatsu-nginx-prod
        build:
            context: .
            dockerfile: .docker/prod/Dockerfile
            target: nginx
        image: sytatsu-nginx:latest
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8081}:80'
        # Same volume as php-fpm, mounted directly at the public URL path so
        # nginx serves uploads without needing the public/storage symlink to
        # resolve across containers (it can't -- separate filesystems).
        volumes:
            - storage-app-public:/var/www/html/public/storage:ro
        depends_on:
            - php-fpm
        networks:
            - sytatsu-prod
            - proxy

networks:
    sytatsu-prod:
        driver: bridge
    proxy:
      external: true
    dbnet:
      external: true

volumes:
    storage-app-public:
        driver: local
